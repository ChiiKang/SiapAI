# XcodeGen project spec — run `xcodegen generate` in this directory.
name: AgentReady
options:
  bundleIdPrefix: com.agentready
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  AgentReady:
    type: application
    platform: iOS
    sources:
      - AgentReady
    settings:
      base:
        # The app's Info.plist is written by XcodeGen from the properties
        # below; the test bundle keeps Xcode's generated one.
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: AgentReady/Info.plist
      properties:
        CFBundleDisplayName: Agent Ready
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Local mode talks to `agent-ready serve` on the Mac over Wi-Fi.
        # NSAllowsLocalNetworking permits plain HTTP to local addresses only
        # — the public internet still requires HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription:
          Agent Ready reads your agent session list from the agent-ready
          server running on your Mac.
  AgentReadyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AgentReadyTests
    dependencies:
      - target: AgentReady
