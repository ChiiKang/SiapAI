# XcodeGen project spec — run `xcodegen generate` in this directory.
name: AgentReady
options:
  bundleIdPrefix: com.agentready
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: false
targets:
  AgentReady:
    type: application
    platform: iOS
    sources:
      - AgentReady
    info:
      path: AgentReady/Info.plist
      properties:
        CFBundleDisplayName: Agent Ready
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
